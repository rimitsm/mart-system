<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fresh Mart Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Fresh Mart 🛒</h1>
    <div class="cart-status">
      Cart (<span id="cart-count">0</span>) - $<span id="cart-total">0.00</span>
    </div>
  </header>

  <main>
    <section class="products-section">
      <h2>Available Products</h2>
      <!-- New Search Input -->
      <div class="search-box" style="margin: 1rem 0;">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search products..." 
          style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;"
        >
      </div>
      <div id="product-grid" class="product-grid"></div>
    </section>

    <aside class="cart-section">
      <h2>Your Basket</h2>
      <ul id="cart-items" class="cart-items"></ul>
      <button id="checkout-btn" class="checkout-btn">Checkout</button>
      <!-- Optional Clear Cart Button -->
      <button id="clear-cart-btn" class="checkout-btn" style="background: #d32f2f; margin-top: 0.5rem;">Clear Cart</button>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
